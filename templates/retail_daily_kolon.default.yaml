# KOLON 零售日报 默认模板（HAR 验证过的完整字段配置）
# 字段名是可读名（中文），脚本运行时自动解析为内部 fdId/dpId。
report: retail_daily_kolon

# 行维度（HAR: 35 个可选维度）
rows:
  - 日历日期
  - 渠道品牌
  - 店铺编码
  - 店铺名称
  - 商品品牌
  - 省份
  - 城市等级
  - 区域
  - 商场体系
  - 门店性质

# 指标字段（HAR: 101 个可选指标）
metrics:
  - 流水
  - 预算流水目标
  - 零售达成
  - 流水同期
  - 流水同比
  - 同店流水
  - 同店流水同期
  - 同店流水同比
  - 预算达成
  - 有效店标识

# 查询条件（筛选）
filters:
  - { name: 渠道品牌, values: [KOLON] }

# 日期等动态参数（dynamicParams 名字 -> 值）
dynamic_params:
  开始日期-户外-R02: 2026-07-22
  结束日期-户外-R02: 2026-07-29

# 分页
limit: 50
offset: 0
