# 渠道运营分析-月报-KOLON - 默认模板
# 用法: anta-cli export -t channel_monthly_kolon.default

report: channel_monthly_kolon

rows:
  - 日历月份
  - 区域
  - 店铺名称

metrics:
  - 月流水本期
  - 月流水同期
  - 月流水同比
  - 月店效本期
  - 月度坪效本期
  - 月有效店数本期
  - 月保有店数本期
  - 年累流水本期
  - 年累流水同期
  - 年累流水同比

filters:
  - { name: 渠道品牌, values: [KOLON] }
  - { name: 店铺类型明细, values: [正价店, 折扣店] }
  - { name: 日历月份, values: ["2026-08"] }

limit: 50
