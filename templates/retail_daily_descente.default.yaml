# 零售运营分析-日报 默认模板（HAR 验证过的完整字段配置）
# 字段名是可读名（中文），脚本运行时自动解析为内部 fdId/dpId。
report: retail_daily_descente

# 行维度（HAR: 4 个）
rows:
  - 渠道品牌
  - 店铺名称
  - 城市等级
  - 商品品牌

# 指标字段（HAR: 9 个）
metrics:
  - 零售流水目标
  - 零售达成
  - 流水
  - 流水同期
  - 流水同比
  - 客单价
  - 同店流水
  - 同店流水同期
  - 同店流水同比

# 顶部查询条件（筛选）
filters:
  - { name: 渠道品牌, values: [DESCENTE] }
  - { name: 商品品牌, values: [迪桑特] }

# 日期等动态参数（dynamicParams 名字 -> 值）
dynamic_params:
  开始日期-户外-R02: 2026-07-22
  结束日期-户外-R02: 2026-07-29

# 分页
limit: 50
offset: 0
