[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anta-scrap"
version = "0.1.0"
description = "安踏 BI (datav.anta.com) 数据抓取与导出库"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
]

[project.scripts]
anta-cli = "anta_scrap.cli:main"

[tool.setuptools.packages.find]
include = ["anta_scrap*"]
